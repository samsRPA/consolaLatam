services:
  consola-latam:
    build: .
    container_name: consola-latam
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - consola_data:/data
    env_file:
      - .env
    networks:
      - default
      - cej_peru_CEJ_Peru_net
      - cj_ecuador_cj_ecuador_net
      - consola_latam_internal_net

