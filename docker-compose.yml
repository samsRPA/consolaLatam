services:
  consola-latam:
    build: .
    container_name: consola-latam
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - consola_data:/data
    env_file:
      - .env
    networks:
      - default
      - cej_peru_CEJ_Peru_net
      - cj_ecuador_cj_ecuador_net

volumes:
  consola_data:

networks:
  # Redes externas de los bots de Peru y Ecuador (creadas por sus propios docker-compose),
  # para llegar a ellos por nombre de contenedor en vez de pasar por el host.
  cej_peru_CEJ_Peru_net:
    external: true
  cj_ecuador_cj_ecuador_net:
    external: true
