volumes:
  consola_data:



networks:
  # Redes externas de los bots de Peru y Ecuador (creadas por sus propios docker-compose),
  # para llegar a ellos por nombre de contenedor en vez de pasar por el host.
  cej_peru_CEJ_Peru_net:
    external: true
  cj_ecuador_cj_ecuador_net:
    external: true
  # Red interna propia para que consola-latam y ssh_consola-latam se comuniquen entre si
  # (ej. consola-latam accede al tunel SSH por el nombre de servicio y su puerto).
  consola_latam_internal_net:
    driver: bridge
